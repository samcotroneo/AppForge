name: Publish npm package

permissions:
  id-token: write
  contents: read

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        required: false
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Sync package.json version from tag
        if: github.event_name == 'push'
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run lint && npm run test:unit && npm run build

      - name: Publish to npm
        run: npm publish
