name: Publish npm package

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        required: false
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run lint && npm run test:unit && npm run build

      - name: Publish to npm
        run: npm publish
